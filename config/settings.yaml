# tradebot settings. Every number TITAN enforces lives here, so it's easy to review.

# paper = simulated fills inside tradebot (no broker needed)
# demo  = broker's paper/sim account (Tradovate demo server, NinjaTrader Sim101)
# live  = REAL MONEY. Also requires TRADEBOT_LIVE_ARMED=yes-real-money in the environment.
mode: paper

timezone: America/New_York

universe:
  - MES
  - MNQ
  - MYM
  - M2K
  - CL
  - MCL
  - GC
  - MGC

session:
  first_entry: "09:35"      # no entries before this (skip the opening auction chaos)
  last_entry: "15:30"       # no NEW entries after this
  flatten_at: "15:50"       # everything closed by this time, every day
  bar_minutes: 5            # VEGA's working timeframe
  higher_tf_minutes: 15     # VEGA's trend filter timeframe
  loop_seconds: 60          # how often the pipeline runs

atlas:
  watchlist_size: 3         # how many symbols get the full VEGA/ORION/LUNA treatment

risk:                       # TITAN's hard limits. AI agents cannot override these.
  risk_per_trade_pct: 1.0   # max loss if stop is hit, % of account equity
  daily_loss_limit_pct: 20.0
  max_trades_per_day: 6
  max_open_positions: 2
  max_contracts_per_trade: 5
  min_reward_risk: 1.5
  min_stop_ticks: 4
  allow_full_size: false    # if false, TITAN rejects CL and GC (full-size) and only allows micros
  hype_risk_size_cut: 0.5   # LUNA reports high hype risk -> size multiplied by this

  # Prop / funded account rules. TITAN always applies the STRICTER of these and the limits above.
  # Defaults below are an Apex 50k-style account. CHECK THEM AGAINST YOUR APEX DASHBOARD:
  # firm rules change, and TITAN can only protect the numbers you give it.
  prop:
    enabled: true
    firm: apex
    starting_balance: 50000.0
    trailing_drawdown: 2500.0      # $ below peak equity at which the account fails
    trailing_type: intraday        # intraday = trails highest equity incl. open P&L; eod = end-of-day balance
    trail_lock_offset: 100.0       # drawdown line stops trailing at starting_balance + $100
    daily_loss_limit: 1000.0       # TITAN's own daily stop in $ (stricter than 20% of the account)
    max_contracts: 10              # contract cap (each micro counts as 1 here, which is conservative)
    drawdown_buffer: 250.0         # TITAN stops trading this many $ BEFORE the firm's line

data:
  source: synthetic         # synthetic = fake prices (paper only) | ninjatrader = live bars via TradebotBridge

news:                       # ORION (news + economic calendar) and LUNA (sentiment)
  source: none              # none | web_search (Claude searches the web; needs ANTHROPIC_API_KEY)
  refresh_minutes: 15       # re-search at most this often per market group (cost control)
  max_searches: 3           # web searches per lookup

nova:
  min_confidence: 0.6       # NOVA rejects setups below this blended confidence

llm:
  model: claude-opus-5-5
  enabled: true             # false = ORION/LUNA/NOVA run rules-only (no API calls)

brokers:
  tradovate:
    enabled: false
    account_spec: ""        # Tradovate account name, e.g. "DEMO123456"
  ninjatrader:
    enabled: false
    account: Sim101         # NinjaTrader account name (Sim101 for sim, your live account name for live)
    # Folder NinjaTrader watches for order instruction files (ATI must be enabled in NinjaTrader)
    nt_folder: "C:/Users/YOU/Documents/NinjaTrader 8"
    starting_equity: 50000.0
    # NinjaTrader needs the explicit contract month. Update on roll dates.
    contracts:
      MES: "12-26"
      MNQ: "12-26"
      MYM: "12-26"
      M2K: "12-26"
      CL: "01-27"
      MCL: "01-27"
      GC: "02-27"
      MGC: "02-27"

paper:
  starting_equity: 50000.0
