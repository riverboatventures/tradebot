[project]
name = "tradebot"
version = "0.1.0"
description = "Multi-agent futures trading bot (ATLAS, VEGA, ORION, LUNA, TITAN, NOVA) for Tradovate and NinjaTrader"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
